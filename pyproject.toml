[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-actions-ci-basics"
version = "0.1.0"
description = "Tiny Python app demonstrating a CI pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Codex" }]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
